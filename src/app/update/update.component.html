<h1>Update Form</h1>

<form action="" #formData="ngForm" (ngSubmit)="update(formData)">
    <div class="form-group">
        <label for="">ID:</label>
        <input type="text" name="id" [(ngModel)]="cemp.id" class="form-control">
    </div>
    <br>
    
    <div class="form-group">
        <label for="">Name:</label>
        <input type="text" name="name"  [(ngModel)]="cemp.name"  class="form-control">
    </div>
    <br>
    
    <div class="form-group">
        <label for="">City:</label>
        <input type="text" name="city" #city [(ngModel)]="cemp.city"  class="form-control">
    </div>
    <br>
    
    <div class="form-group">
        <label for="">Salary:</label>
        <input type="text" name="salary" #salary [(ngModel)]="cemp.salary"  class="form-control">
    </div>
    <br>
    
    <div class="form-group">
        <label for="">Position:</label>
        <input type="text" name="position" #position [(ngModel)]="cemp.position"  class="form-control">
    </div>
    <br>
    <button type="reset" class="btn btn-warning">Reset</button>&nbsp;&nbsp;&nbsp;
    <button class="btn btn-success">Update</button>
</form>
